<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#7c1113" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a0708" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BFT">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Controle central dos ar-condicionados da escola BFT">
  <title>Ar-condicionados BFT</title>

  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,30..80&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>

  <div class="app" id="app">

    <!-- ===================== HOME ===================== -->
    <section class="view active" data-view="home">
      <header class="topbar">
        <div class="topbar__left">
          <img src="img/logo.png" class="topbar__logo" alt="Logo BFT">
          <div class="topbar__brand">
            <div class="topbar__kicker">Sistema</div>
            <div class="topbar__name">Ar-cond. BFT</div>
          </div>
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" data-action="toggle-theme" aria-label="Alternar tema" id="btn-theme">
            <svg class="icon-btn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/>
            </svg>
            <svg class="icon-btn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
          <button class="icon-btn" data-action="goto-admin" aria-label="ConfiguraÃ§Ãµes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="home">
        <div class="hero">
          <div class="hero__title-wrap">
            <div class="hero__eyebrow">Controle Central</div>
            <h1 class="hero__title">Ar-condicionados<br><em>BFT</em></h1>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat__value" id="stat-ligados">0</div>
            <div class="stat__label">Ligados</div>
          </div>
          <div class="stat__divider"></div>
          <div class="stat">
            <div class="stat__value" id="stat-total">6</div>
            <div class="stat__label">Salas</div>
          </div>
          <div class="stat__divider"></div>
          <div class="stat">
            <div class="stat__value stat__value--small" id="stat-agenda">â€”</div>
            <div class="stat__label">ProgramaÃ§Ã£o</div>
          </div>
        </div>

        <div id="banner-area"></div>
        <div id="grupos-area"></div>
      </main>

      <button class="fab" id="fab-desligar" data-action="desligar-todos" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <span>Desligar tudo</span>
      </button>
    </section>

    <!-- ===================== SALA ===================== -->
    <section class="view" data-view="sala">
      <header class="topbar topbar--ghost">
        <button class="icon-btn icon-btn--filled" data-action="back" aria-label="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div style="flex:1"></div>
        <img src="img/logo.png" class="topbar__logo topbar__logo--sm" alt="">
      </header>

      <main class="sala">
        <div class="sala__header">
          <div class="sala__eyebrow" id="sala-grupo">â€”</div>
          <h2 class="sala__nome" id="sala-nome">â€”</h2>
        </div>

        <div class="dial-wrap">
          <div class="dial" id="dial" data-on="false">
            <svg class="dial__svg" viewBox="0 0 220 220" aria-hidden="true">
              <defs>
                <linearGradient id="dial-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#c0282d"/>
                  <stop offset="60%" stop-color="#7c1113"/>
                  <stop offset="100%" stop-color="#5a0c0e"/>
                </linearGradient>
                <radialGradient id="dial-glow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="rgba(124,17,19,0.15)"/>
                  <stop offset="100%" stop-color="rgba(124,17,19,0)"/>
                </radialGradient>
              </defs>
              <circle class="dial__aura" cx="110" cy="110" r="96" fill="url(#dial-glow)"/>
              <circle class="dial__ring" cx="110" cy="110" r="102" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="1 6"/>
              <path class="dial__track" d="M 46 174 A 90 90 0 1 1 174 174" fill="none" stroke-width="4" stroke-linecap="round"/>
              <path class="dial__progress" id="dial-prog" d="M 46 174 A 90 90 0 1 1 174 174" fill="none" stroke="url(#dial-grad)" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
              <g id="dial-ticks"></g>
            </svg>
            <div class="dial__inner">
              <div class="dial__label">Temperatura</div>
              <div class="dial__temp" id="dial-temp">
                <span id="dial-num">22</span><span class="dial__unit">Â°</span>
              </div>
              <div class="dial__state">
                <span class="dial__dot"></span>
                <span id="dial-state">Desligado</span>
              </div>
            </div>
          </div>
        </div>

        <div class="ctrl">
          <button class="ctrl__btn" id="btn-minus" aria-label="Diminuir" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="12" x2="18" y2="12"/></svg>
          </button>
          <div class="ctrl__range">
            <div class="ctrl__range-value" id="ctrl-range-val">22Â°</div>
            <div class="ctrl__range-label">Ajuste</div>
          </div>
          <button class="ctrl__btn" id="btn-plus" aria-label="Aumentar" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
          </button>
        </div>

        <button class="power" id="btn-power" data-on="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
          <span id="power-text">Ligar</span>
        </button>
      </main>
    </section>

    <!-- ===================== ADMIN ===================== -->
    <section class="view" data-view="admin">
      <header class="topbar">
        <button class="icon-btn icon-btn--filled" data-action="back" aria-label="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="topbar__brand" style="margin-left:0.6rem">
          <div class="topbar__kicker">ConfiguraÃ§Ãµes</div>
          <div class="topbar__name">Painel Admin</div>
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" id="admin-logout-btn" aria-label="Sair" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>
      <main class="admin" id="admin-content"></main>
    </section>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__card" role="dialog" aria-modal="true">
      <div class="modal__icon" id="modal-icon"></div>
      <h3 class="modal__title" id="modal-title"></h3>
      <p class="modal__desc" id="modal-desc"></p>
      <div class="modal__actions">
        <button class="btn btn--ghost" data-modal-close id="modal-cancel">Cancelar</button>
        <button class="btn btn--primary" id="modal-confirm">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=16"></script>
  <script src="js/theme.js?v=16"></script>
  <script src="js/api.js?v=16"></script>
  <script src="js/icons.js?v=16"></script>
  <script src="js/modal.js?v=16"></script>
  <script src="js/home.js?v=16"></script>
  <script src="js/sala.js?v=16"></script>
  <script src="js/admin.js?v=16"></script>
  <script src="js/scheduler.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
</body>
</html>
